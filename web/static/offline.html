<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22386A">
    <title>Offline - Backbone Plate</title>
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <div class="auth-screen">
      <main class="auth-card">
        <div class="auth-brand">
          <div class="logo-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <div class="logo-name">Backbone</div>
            <div class="logo-sub">Plate</div>
          </div>
        </div>
        <div class="auth-head">
          <h1 class="auth-title">You are offline</h1>
          <p class="auth-sub">Reconnect to view or update your household meal plan.</p>
        </div>
        <button class="btn" type="button" style="width: 100%; justify-content: center;" onclick="location.reload()">
          Try again
        </button>
      </main>
    </div>
  </body>
</html>
