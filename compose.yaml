services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      BASE_PATH: "${BASE_PATH:-}"
      DATABASE_URL: "postgres://mealplanner:mealplanner@db:5432/mealplanner?sslmode=disable"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-mealplanner_session}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-production}"
      APP_ENV: "${APP_ENV:-production}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      LOGIN_THROTTLE_THRESHOLD: "${LOGIN_THROTTLE_THRESHOLD:-5}"
      LOGIN_THROTTLE_WINDOW: "${LOGIN_THROTTLE_WINDOW:-10m}"
      LOGIN_THROTTLE_BLOCK_DURATION: "${LOGIN_THROTTLE_BLOCK_DURATION:-15m}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: mealplanner
      POSTGRES_DB: mealplanner
    volumes:
      - mealplanner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplanner -d mealplanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mealplanner-pgdata:
